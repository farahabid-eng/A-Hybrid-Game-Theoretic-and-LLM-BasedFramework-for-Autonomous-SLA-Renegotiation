[project]
name = "sla-renegotiation"
version = "0.1.0"
description = "LLM-based SLA renegotiation framework"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.17",
    "langchain-core>=1.2.26",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "langchain-mistralai>=1.1.4",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
mistral = ["langchain-mistralai>=0.3.0"]
all = ["sla-renegotiation[openai,anthropic,mistral]"]

[project.scripts]
sla-renegotiation = "sla_renegotiation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
exclude = ["tests/"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
